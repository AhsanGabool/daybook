<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Your day in one place: tasks, edits, meetings, learning, ideas and routine.">
<meta name="theme-color" content="#0c0c18" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f2f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
  <div class="top-in">
    <div class="top-text">
      <div class="eyebrow" id="today-label"></div>
      <h1 id="view-title">Today</h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" data-action="settings" aria-label="Settings and sync">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        <span class="sync-badge" id="sync-dot"></span>
      </button>
    </div>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<div class="dock-wrap">
  <nav class="dock" aria-label="Sections">
    <button data-tab="today" aria-label="Today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
    <button data-tab="tasks" aria-label="Tasks"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 12.3l2.7 2.7L16 9.6"/></svg><span>Tasks</span></button>
    <button data-tab="edits" aria-label="Edits"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="14" height="13" rx="3.5"/><path d="M16.5 10l5-3v10l-5-3"/></svg><span>Edits</span></button>
    <button data-tab="meetings" aria-label="Meetings"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="4"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Meetings</span></button>
    <button data-tab="grow" aria-label="Grow: routine, learning and ideas"><svg viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 7-8 7Z"/><path d="M12 14c0-3-2.5-5.5-7-5.5 0 4 2.5 5.5 7 5.5Z"/></svg><span>Grow</span></button>
  </nav>
  <button class="fab" data-action="quick-add" aria-label="Add something">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-bg" data-action="close-sheet"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
